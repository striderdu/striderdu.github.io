bio: |
  I am a Ph.D. candidate at the School of Computer Science, Northwestern Polytechnical University, advised by [Prof. Zhen Wang](https://iopen.nwpu.edu.cn/info/1329/1369.htm).
  And I am also a visiting student of LARS Group, advised by [Dr. Quanming Yao](https://lars-group.github.io/).
  Before this, I obtained my bachelor and master degree at Northwestern Polytechnical University.
  
  My research interests include knowledge graph reasoning, recommendation systems, and neural architecture search.

